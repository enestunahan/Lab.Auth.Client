<div class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-2 font-bold text-lg">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-slate-900 text-white text-sm">
          KT
        </span>
        <span>Kitaplık</span>
      </a>

      <ul class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
        <li>
          <a
            routerLink="/"
            routerLinkActive="bg-slate-100 text-slate-900"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
          >
            Ana Sayfa
          </a>
        </li>
        <li>
          <a
            routerLink="/admin"
            routerLinkActive="bg-slate-100 text-slate-900"
            class="px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
          >
            Yönetim Paneli
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-sm text-slate-500 flex flex-col sm:flex-row justify-between gap-2">
      <span>&copy; {{ 2026 }} Kitaplık — Angular öğrenme projesi</span>
      <span class="text-slate-400">Lab.Auth.Client · Adım 4</span>
    </div>
  </footer>
</div>
